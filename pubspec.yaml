name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 1.0.8+108

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.11.1
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.3
  path_provider_windows: ^2.3.0
  shared_preferences: ^2.5.4
  shared_preferences_platform_interface: ^2.4.2
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  flutter_foreground_task: 10.0.0
  ffmpeg_kit_flutter_new_min_gpl: 2.6.7
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  package_info_plus: ^10.2.1
  dynamic_color: ^1.9.0
  url_launcher: ^6.3.3
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  # OpenHarmony 适配版插件：只在鸿蒙上生效，其他平台沿用上游实现。
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: d4e49daa0acbd0bc419d58b1da27d64d44fab54b
      path: packages/path_provider/path_provider
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: 143d83e7669a359a1ab1ee6558c4a2e4f7f4c53f
      path: packages/shared_preferences/shared_preferences
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: ae4494a78db5a9e0fe760b0eba9231605ae45716
      path: packages/url_launcher/url_launcher
  video_player:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: 99532ec5923ef466776a60345537f308adc5ef25
      path: packages/video_player/video_player

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
